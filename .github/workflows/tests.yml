name: tests

# Changed plugins on PRs/pushes; all plugins on scheduled/manual runs.
# The nightly run catches a core change that breaks a plugin before a user does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flexpair-color-palette:
    needs: discover
    if: needs.discover.outputs.flexpair_changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: flexpair-color-palette/package-lock.json
      - name: Test the bundled desktop plugin
        working-directory: flexpair-color-palette
        run: npm ci --ignore-scripts && npm test
      - name: Verify the committed artifact is current
        run: git diff --exit-code -- flexpair-color-palette/desktop/plugin.js

  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      has_plugins: ${{ steps.list.outputs.has_plugins }}
      flexpair_changed: ${{ steps.list.outputs.flexpair_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test plugin selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/changed_plugins.py --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  pytest:
    needs: discover
    if: needs.discover.outputs.has_plugins == 'true'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.plugin }} · ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: pantheon
      # Plugins import Hermes core (gateway, agent, tools) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes core gates its runtime dependencies on python_version >= '3.14'.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent and the plugin's dependencies
        shell: bash
        run: |
          python -m pip install -e ./hermes-agent pytest pytest-asyncio
          deps=$(python -c 'import pathlib,sys,tomllib; p=pathlib.Path(sys.argv[1]); print("\n".join(tomllib.loads(p.read_text())["project"].get("dependencies", [])) if p.is_file() else "")' "pantheon/${{ matrix.plugin }}/pyproject.toml")
          if [ -n "$deps" ]; then printf '%s\n' "$deps" > "$RUNNER_TEMP/plugin-reqs.txt"; python -m pip install -r "$RUNNER_TEMP/plugin-reqs.txt"; fi
      - name: Validate the manifest against core
        shell: bash
        run: python -m hermes_cli.main plugins validate "pantheon/${{ matrix.plugin }}"
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run the plugin suite
        if: hashFiles(format('pantheon/{0}/tests/**', matrix.plugin)) != ''
        working-directory: pantheon/${{ matrix.plugin }}
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
