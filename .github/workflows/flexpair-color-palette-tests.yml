name: Flexpair color palette tests

# Fork-only workflow: keep the upstream plugin workflow untouched.
on:
  pull_request:
    paths:
      - 'flexpair-color-palette/**'
      - '.github/workflows/flexpair-color-palette-tests.yml'
  push:
    branches: [main]
    paths:
      - 'flexpair-color-palette/**'
      - '.github/workflows/flexpair-color-palette-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Flexpair npm · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flexpair-color-palette
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: flexpair-color-palette/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run bundled-plugin tests
        run: npm test
      - name: Verify committed bundle is current
        run: git diff --exit-code -- desktop/plugin.js
